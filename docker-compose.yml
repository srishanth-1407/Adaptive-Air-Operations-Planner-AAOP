services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aaop-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDPANDA_BROKERS=redpanda:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=aaop
      - POSTGRES_USER=aaop_user
      - POSTGRES_PASSWORD=aaop_password
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aaop-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: aaop-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  redis:
    image: redis:7-alpine
    container_name: aaop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: aaop-postgres
    environment:
      - POSTGRES_DB=aaop
      - POSTGRES_USER=aaop_user
      - POSTGRES_PASSWORD=aaop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaop_user -d aaop"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
